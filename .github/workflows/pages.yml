name: Deploy Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20.20.2
          cache: npm
      - name: Require deployment configuration
        run: |
          test "$VITE_BASE_PATH" = "/admin/"
          case "$VITE_API_URL" in
            https://*.invalid/*|https://*.test/*|https://localhost*|https://127.*|http://*|"")
              echo "VITE_API_URL must be the real HTTPS release API ending in /api" >&2
              exit 1
              ;;
          esac
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build:public
      - run: npm run verify:build
      - name: Scan release source for secrets
        run: |
          mkdir -p "$RUNNER_TEMP/source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/source"
          docker run --rm -v "$RUNNER_TEMP/source:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 dir /repo --redact --no-banner
      - name: Assemble site
        run: |
          mkdir -p site/admin
          cp -R build/. site/admin/
          for route in home admins users workouts reports support settings audit-log reset-password; do
            mkdir -p "site/admin/$route"
            cp build/index.html "site/admin/$route/index.html"
          done
          cp -R public-build/. site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
