name: Deploy Pages

# Publishes the redirect site generated by scripts/build-redirect-site.mjs.
# The site has no dependencies and no build configuration; the tests (which
# run the supply-chain scan first) are the only gate before the artifact is
# uploaded.

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20.20.2
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Scan release source for secrets
        run: |
          mkdir -p "$RUNNER_TEMP/source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/source"
          docker run --rm -v "$RUNNER_TEMP/source:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 dir /repo --redact --no-banner
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
