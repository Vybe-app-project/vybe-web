name: Deploy Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20.20.2
          cache: npm
      - name: Require deployment configuration
        run: test -n "$VITE_API_URL" && test -n "$VITE_BASE_PATH"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run verify:build
      - name: Assemble site
        run: |
          mkdir -p site/admin
          cp -R build/. site/admin/
          for route in home admins users workouts reports settings reset-password; do
            mkdir -p "site/admin/$route"
            cp build/index.html "site/admin/$route/index.html"
          done
          cp public-site-index.html site/index.html
          cp privacy-policy.html terms-and-conditions.html account-deletion.html open.html site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
