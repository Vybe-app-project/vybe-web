<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Open shared Vybe fitness content in the Vybe app">
    <meta name="robots" content="noindex">
    <title>Open in Vybe</title>
    <style>
        :root {
            color-scheme: light;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            place-items: center;
            background: linear-gradient(160deg, #eefcf8 0%, #ffffff 55%, #f4f7ff 100%);
            color: #17212b;
        }

        main {
            width: min(100%, 460px);
            padding: 36px 28px;
            border: 1px solid #dce8e5;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.94);
            box-shadow: 0 18px 50px rgba(18, 70, 61, 0.12);
            text-align: center;
        }

        .mark {
            display: grid;
            width: 72px;
            height: 72px;
            margin: 0 auto 22px;
            border-radius: 22px;
            background: #007f72;
            color: #fff;
            font-size: 32px;
            font-weight: 800;
            place-items: center;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 28px;
        }

        p {
            margin: 0 0 24px;
            color: #56636f;
            line-height: 1.55;
        }

        .button {
            display: block;
            width: 100%;
            padding: 14px 18px;
            border-radius: 14px;
            background: #007f72;
            color: #fff;
            font-weight: 750;
            text-decoration: none;
        }

        .button:focus,
        .button:hover {
            background: #00665c;
        }

        .links {
            margin-top: 24px;
            font-size: 13px;
        }

        .links a {
            color: #52606c;
        }
    </style>
</head>
<body>
    <main>
        <div class="mark" aria-hidden="true">V</div>
        <h1 id="title">Open in Vybe</h1>
        <p id="description">Continue to this shared fitness content in the Vybe app.</p>
        <a class="button" id="open-button" href="vybe://open">Open Vybe</a>
        <p class="links">
            <a href="privacy-policy.html">Privacy</a>
            &middot;
            <a href="terms-and-conditions.html">Terms</a>
            &middot;
            <a href="account-deletion.html">Account deletion</a>
            &middot;
            <a href="support.html">Support</a>
        </p>
    </main>
    <script>
        (() => {
            const params = new URLSearchParams(window.location.search);
            const allowedTypes = new Set(["post", "profile", "meal", "workout", "gym"]);
            const type = allowedTypes.has(params.get("type")) ? params.get("type") : "";
            const id = (params.get("id") || "").replace(/[^a-zA-Z0-9_-]/g, "");
            const label = type ? `${type[0].toUpperCase()}${type.slice(1)}` : "content";
            const destination = new URL("vybe://open");

            if (type && id) {
                destination.searchParams.set("type", type);
                destination.searchParams.set("id", id);
                document.getElementById("title").textContent = `Open this ${label} in Vybe`;
                document.getElementById("description").textContent =
                    `Vybe will take you directly to the shared ${label.toLowerCase()}.`;
            }

            document.getElementById("open-button").href = destination.toString();
        })();
    </script>
</body>
</html>
